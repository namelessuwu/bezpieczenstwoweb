env:
  contexts:
  - name: login-flask
    urls: 
    - https://flaskshop.online/login
    includePaths:
    - ^https://flaskshop\.online/.*$
    authentication:
      method: form
      parameters:
        loginPageUrl: https://flaskshop.online/login
        loginRequestUrl: https://flaskshop.online/login
        loginRequestBody: "username={%username%}&password={%password%}&submit=Log+in"
      verification:
        method: autodetect
        pollFrequency: 60
        pollUnits: requests
        pollUrl: ""
        pollPostData: ""
    sessionManagement:
      method: cookie
    technology: {}
    structure: {}
    users:
    - name: zap-user
      credentials:
        password: ${ZAP_PASS}
        username: ${ZAP_USER}
  parameters: {}
jobs:
- type: spider
  parameters:
    context: login-flask
    url: https://flaskshop.online

- type: activeScan
  parameters:
    context: login-flask
    url: https://flaskshop.online

- type: report
   name: HTML Report
   parameters:
     template: traditional-html
     reportDir: /zap/wrk/.zap/plan-results/
     reportFile: zap-report.html
     reportTitle: "FlaskShop ZAP HTML Report"
     displayReport: false

- type: report
  name: XML Report
   parameters:
     template: traditional-xml
     reportDir: /zap/wrk/.zap/plan-results/
     reportFile: zap-report.xml
     reportTitle: "FlaskShop ZAP XML Report"
     displayReport: false

 - type: report
   name: JSON Report
   parameters:
     template: traditional-json
     reportDir: /zap/wrk/.zap/plan-results/
     reportFile: zap-report.json
     reportTitle: "FlaskShop ZAP JSON Report"
     displayReport: true
