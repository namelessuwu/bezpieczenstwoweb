env:
  contexts:
    - name: login-flask
      urls:
        - ${TARGET_URL}
      includePaths:
        - ^${TARGET_URL}.*$
      authentication:
        method: form
        parameters:
          loginPageUrl: ${TARGET_URL}/login
          loginRequestUrl: ${TARGET_URL}/login
          loginRequestBody: "username={%username%}&password={%password%}&submit=Log+in"
        verification:
          method: autodetect
          pollFrequency: 60
          pollUnits: requests
          pollUrl: ""
          pollPostData: ""
      sessionManagement:
        method: cookie
      technology: {}
      structure: {}
      users:
        - name: zap-user
          credentials:
            username: ${ZAP_USER}
            password: ${ZAP_PASS}

jobs:
  - type: spider
    name: spider
    parameters:
      context: login-flask
      url: ${TARGET_URL}
      user: zap-user

  - type: activeScan
    name: active-scan
    parameters:
      context: login-flask
      url: ${TARGET_URL}
      user: zap-user

  - type: report
    name: HTML Report
    parameters:
      template: traditional-html
      reportDir: "/zap/wrk/.zap/plan-results/"
      reportFile: zap-report.html
      reportTitle: "FlaskShop ZAP HTML Report"
      displayReport: false

  - type: report
    name: XML Report
    parameters:
      template: traditional-xml
      reportDir: "/zap/wrk/.zap/plan-results/"
      reportFile: zap-report.xml
      reportTitle: "FlaskShop ZAP XML Report"
      displayReport: false

  - type: report
    name: JSON Report
    parameters:
      template: traditional-json
      reportDir: "/zap/wrk/.zap/plan-results/"
      reportFile: zap-report.json
      reportTitle: "FlaskShop ZAP JSON Report"
      displayReport: false
