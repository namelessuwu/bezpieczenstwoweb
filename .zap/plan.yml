env:
  contexts:
  - name: login-flask
    urls: 
    - https://flaskshop.online/login
    includePaths:
    - ^https://flaskshop\.online/.*$
    authentication:
      method: form
      parameters:
        loginPageUrl: https://flaskshop.online/login
        loginRequestUrl: https://flaskshop.online/login
        loginRequestBody: "username={%username%}&password={%password%}&submit=Log+in"
      verification:
        method: autodetect
        pollFrequency: 60
        pollUnits: requests
        pollUrl: ""
        pollPostData: ""
    sessionManagement:
      method: cookie
    technology: {}
    structure: {}
    users:
    - name: zap-user
      credentials:
        password: ${ZAP_PASS}
        username: ${ZAP_USER}
  parameters: {}
jobs:
- type: activeScan
  parameters:
    context: login-flask
    url: https://flaskshop.online
  policyDefinition: {}

