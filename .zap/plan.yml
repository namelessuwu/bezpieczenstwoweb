version: "2.1"

# Correct top-level key is `environments` (plural)
environments:
  - name: default
    contexts:
      - name: flaskshop
        include:
          - "${FLASKSHOP_URL}.*"   # URL included in the context

jobs:
  # Step 1: spider while authenticating (so ZAP builds a logged-in site map)
  - name: login-and-spider
    type: spider
    target: "${FLASKSHOP_URL}"
    context: flaskshop
    auth:
      type: formBasedAuthentication
      loginRequestUrl: "${FLASKSHOP_URL}/login"
      # use parameter names your login form actually expects
      loginRequestBody: "username=${ZAP_USER}&password=${ZAP_PASS}"
    sessionManagement:
      type: cookieBasedSessionManagement
    users:
      - name: zap-user
        enabled: true
        credentials:
          - name: username
            value: "${ZAP_USER}"
          - name: password
            value: "${ZAP_PASS}"
    # run a spider to crawl as the logged-in user
    maxDepth: 5

  # Step 2: passive + active scan of the authenticated crawl results
  - name: active-scan
    type: activeScan
    target: "${FLASKSHOP_URL}"
    context: flaskshop
    # tune the active scan as needed; activeScan is intrusive — run on staging if possible

reports:
  - type: html
    fileName: zap-report.html
