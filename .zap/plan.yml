env:
  contexts:
  - name: login-flask
    includePaths:
    - ^${FLASKSHOP_URL}.*$
    authentication:
      method: form
      parameters:
        loginPageUrl: ${FLASKSHOP_URL}/login
        loginRequestUrl: ${FLASKSHOP_URL}/login
        # użyj placeholderów zamiast jawnego hasła
        loginRequestBody: "username={%username%}&password={%password%}&submit=Log+in"
      verification:
        method: autodetect
        pollFrequency: 60
        pollUnits: requests
        pollUrl: ""
        pollPostData: ""
    sessionManagement:
      method: cookie
    technology: {}
    structure: {}
    users:
    - name: zap-user
      # zamiast jawnych credentiali — użyj zmiennych środowiskowych przekazywanych przez GH Actions
      credentials:
        username: ${ZAP_USER}
        password: ${ZAP_PASS}
  parameters: {}
jobs:
- type: activeScan
  parameters: {}
  policyDefinition: {}
