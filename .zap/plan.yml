type: Automation

# top-level variables (reference container env vars)
vars:
  TARGET_URL: "${TARGET_URL}"
  REPORT_NAME: "${REPORT_NAME:-zap-auth-report.html}"

# contexts define the scope and authentication
contexts:
  - name: "CIContext"
    include:
      - "${TARGET_URL}.*"
    sessionManagement:
      method: "cookieBasedSessionManagement"
    authentication:
      method: "formBasedAuthentication"
      loginUrl: "${TARGET_URL}/login"
      loginRequestData: "username={%username%}&password={%password%}"
    users:
      - name: "ci-user"
        enabled: true
        credentials:
          username: "${ZAP_USER}"
          password: "${ZAP_PASS}"

jobs:
  - name: "Spider (context + user)"
    type: "spider"
    context: "CIContext"
    user: "ci-user"
    options:
      maxDepth: 5

  - name: "AjaxSpider"
    type: "spiderAjax"
    context: "CIContext"
    user: "ci-user"
    options:
      maxDuration: 120

  - name: "Authenticated Active Scan"
    type: "activeScan"
    context: "CIContext"
    user: "ci-user"
    options:
      politeness: "default"
      scanPolicyName: "Default Policy"

  - name: "Generate Reports"
    type: "report"
    options:
      formats:
        - html
        - json
      filename: "${REPORT_NAME}"
      outdir: ".zap/output"
