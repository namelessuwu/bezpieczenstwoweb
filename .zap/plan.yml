---
version: "2.1"
environment:
  - name: default
    contexts:
      - name: flaskshop
        include:
          - "${FLASKSHOP_URL}.*"

    applications:
      - name: flaskshop-app
        type: 'web'
        url: "${FLASKSHOP_URL}"
        # NOTE: ZAP Automation Framework supports environment variable interpolation

jobs:
  - name: authenticated-spider-passive
    type: spider
    target: "${FLASKSHOP_URL}"
    context: flaskshop
    # use form-based login
    auth:
      type: formBasedAuthentication
      loginRequestUrl: "${FLASKSHOP_URL}/login"
      loginRequestBody: "username=${ZAP_USER}&password=${ZAP_PASS}"
      # If the app uses different parameter names, change them above.
    sessionManagement:
      type: cookieBasedSessionManagement
    users:
      - name: zap-user
        enabled: true
        credentials:
          - name: username
            value: "${ZAP_USER}"
          - name: password
            value: "${ZAP_PASS}"
    jobs:
      - spider
      - ajaxSpider
      - passiveScan
      - activeScan
    report:
      - type: html
        fileName: zap-report.html
