name: DAST - ZAP Authenticated Full Scan (AF)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show plan (no secrets)
        run: |
          echo "Files in .zap:"
          ls -la .zap || true
          echo "Plan preview (no secrets):"
          sed -n '1,200p' .zap/plan.yml || true

      - name: Run ZAP Automation Framework plan
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            TARGET_URL
            ZAP_USER
            ZAP_PASS
            REPORT_NAME
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER:    ${{ secrets.ZAP_USER }}
          ZAP_PASS:    ${{ secrets.ZAP_PASS }}
          REPORT_NAME: zap-auth-report.html

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-auth-reports
          path: |
            .zap/output/**
            zap-auth-report.*
            zap-auth-report.json
