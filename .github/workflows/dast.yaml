name: DAST - ZAP Authenticated Full Scan (AF)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-auth:
    runs-on: ubuntu-latest

    # Set required secrets at the job-level so the action's docker run sees them
    env:
      TARGET_URL: ${{ secrets.TARGET_URL }}
      ZAP_USER:    ${{ secrets.ZAP_USER }}
      ZAP_PASS:    ${{ secrets.ZAP_PASS }}
      REPORT_NAME: zap-auth-report.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show .zap folder (no secrets)
        run: |
          echo "Files in .zap:"
          ls -la .zap || true
          echo "Preview plan header (no secrets):"
          sed -n '1,200p' .zap/plan.yml || true

      - name: Check secret presence (no values printed)
        run: |
          for v in TARGET_URL ZAP_USER ZAP_PASS; do
            if [ -z "${!v}" ]; then
              echo "$v is EMPTY"
            else
              echo "$v is SET"
            fi
          done

      - name: Run ZAP Automation Framework plan
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            TARGET_URL
            ZAP_USER
            ZAP_PASS
            REPORT_NAME

      - name: Upload ZAP reports (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: zap-auth-reports
          path: |
            .zap/output/**
            zap-auth-report.*
            zap-auth-report.json
