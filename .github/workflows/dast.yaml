name: ZAP AF authenticated scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site reachable
        run: |
          echo "Checking ${TARGET_URL}"
          curl -v --max-time 20 --silent --show-error --fail "${TARGET_URL}" || (echo "Site unreachable from runner" && exit 1)
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            TARGET_URL
            ZAP_USER
            ZAP_PASS
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-report.html
            zap-report.xml
            zap-report.json
            .zap/plan-results/**/zap-report.html
            .zap/plan-results/**/zap-report.xml
            .zap/plan-results/**/zap-report.json

  analyze-artifact:
    runs-on: ubuntu-latest
    needs: zap-scan
    steps:
      - name: Download zap-reports artifact
        uses: actions/download-artifact@v4
        with:
          name: zap-reports
          path: downloaded_artifacts
      
      - name: Analyze ZAP report (grep + awk, no python)
        id: analyze
        run: |
          set -euo pipefail
          XML=$(find downloaded_artifacts -type f -iname 'zap-report.xml' -print -quit || true)
          HTML=$(find downloaded_artifacts -type f -iname 'zap-report.html' -print -quit || true)
          echo "xml_path=${XML:-}" >> $GITHUB_OUTPUT
          echo "html_path=${HTML:-}" >> $GITHUB_OUTPUT

          if [ -z "${XML:-}" ]; then
            echo "No XML report found in artifact."
            echo "high_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Parsing riskcode values from: $XML"

          # extract numeric riskcode values robustly using grep/sed/awk
          # Works whether <riskcode>2</riskcode> appears on one line or with whitespace
          # Use tr to squeeze newlines then grep to find digits, fallback safe default
          RISKCODES=$(tr '\n' ' ' < "$XML" | grep -oP '(?<=<riskcode>)[0-9]+' || true)

          if [ -z "$RISKCODES" ]; then
            echo "No <riskcode> entries found."
            echo "high_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # check if any riskcode >= 3
          echo "$RISKCODES" | awk '
            {
              for(i=1;i<=NF;i++){
                if($i+0 >= 3){
                  print "high_found=true"
                  exit 0
                }
              }
              print "high_found=false"
            }' > risk_check.txt

          cat risk_check.txt
          echo "$(cat risk_check.txt)" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue with ZAP report (only if high_found)
        if: steps.analyze.outputs.high_found == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ZAP Scan — High/Critical alerts detected"
          content-filepath: ${{ steps.analyze.outputs.html_path || steps.analyze.outputs.xml_path }}
          labels: |
            security
            zap
            automated-scan
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: No-issue notice
        if: steps.analyze.outputs.high_found == 'false'
        run: echo "No HIGH/CRITICAL alerts found — no issue created."

      - name: Done
        run: echo "analyze-artifact job finished."
