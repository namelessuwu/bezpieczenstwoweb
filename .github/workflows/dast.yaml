name: ZAP AF authenticated scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site reachable
        run: |
          echo "Checking ${FLASKSHOP_URL}"
          curl -v --max-time 20 --silent --show-error --fail "${FLASKSHOP_URL}" || (echo "Site unreachable from runner" && exit 1)
        env:
          FLASKSHOP_URL: ${{ secrets.TARGET_URL }}

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            ZAP_USER
            ZAP_PASS
        env:
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}

      - name: Collect ZAP reports into repository root
        if: always()
        run: |
          # Znajdź wszystkie pliki nazwane zap-report.* i skopiuj je na root
          FOUND=false
          while IFS= read -r f; do
            echo "Found report: $f"
            cp -v "$f" .
            FOUND=true
          done < <(find . -type f -iname 'zap-report.*' -print || true)

          if [ "$FOUND" = false ]; then
            echo "No zap-report.* files found in workspace. Listing directories for manual inspection:"
            ls -la
            # dodatkowe wyszukiwanie szczegółowe - pokaż potencjalne katalogi .zap/plan-results
            ls -la .zap || true
            find . -maxdepth 3 -type f -print | sed -n '1,200p' || true
          fi

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-report.html
            zap-report.xml
            zap-report.json
            .zap/plan-results/**/zap-report.html
            .zap/plan-results/**/zap-report.xml
            .zap/plan-results/**/zap-report.json
