name: ZAP AF authenticated scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site reachable
        run: |
          echo "Checking ${TARGET_URL}"
          curl -v --max-time 20 --silent --show-error --fail "${TARGET_URL}" || (echo "Site unreachable from runner" && exit 1)
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            TARGET_URL
            ZAP_USER
            ZAP_PASS
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}
        
      - name: Show workspace files (debug)
        if: always()
        run: |
          echo "Workspace root listing:"
          ls -la
          echo "Find zap-report files (any location):"
          find . -type f -iname 'zap-report*' -print || true

      - name: Copy found ZAP reports to repository root
        if: always()
        run: |
          FOUND=false
          while IFS= read -r f; do
            echo "Copying $f to repo root"
            cp -v "$f" .
            FOUND=true
          done < <(find /zap/wrk -maxdepth 3 -type f -iname 'zap-report*' -print || true)
          # fallback: search workspace if the above found nothing
          if [ "$FOUND" = false ]; then
            while IFS= read -r f; do
              echo "Fallback copy $f to repo root"
              cp -v "$f" .
              FOUND=true
            done < <(find . -type f -iname 'zap-report*' -print || true)
          fi
          if [ "$FOUND" = false ]; then
            echo "No zap-report files were found."
          fi

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-report.html
            zap-report.xml
            zap-report.json
