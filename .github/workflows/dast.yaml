name: ZAP AF authenticated scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:                 
      - name: Checkout     
        uses: actions/checkout@v4

      - name: Check site reachable
        run: |             
          echo "Checking ${TARGET_URL}"
          curl -v --max-time 20 --silent --show-error --fail "${TARGET_URL}" || (echo "Site unreachable from runner" && exit 1)
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |   
            TARGET_URL
            ZAP_USER
            ZAP_PASS
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-report.html
            zap-report.xml
            zap-report.json
            .zap/plan-results/**/zap-report.html
            .zap/plan-results/**/zap-report.xml
            .zap/plan-results/**/zap-report.json
            
  analyze-artifact:
      runs-on: ubuntu-latest
      needs: zap-scan
      steps:
      - name: Download zap-reports artifact
        uses: actions/download-artifact@v4
        with:
          name: zap-reports
          path: downloaded_artifacts
          
      - name: Create GitHub Issue with HTML report (only if HIGH/CRITICAL)
        if: ${{ needs.zap-scan.result == 'success' || needs.zap-scan.result == 'failure' }} && startsWith(needs.zap-scan.outcome, '') && steps.analyze.outputs.high_found == 'true'
        # The condition above ensures the scan ran and the analyze step set high_found=true
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "ZAP Scan — High/Critical alerts detected 🚨"
          # Use the downloaded HTML report if present; fallback to XML if not
          content-filepath: ${{ steps.analyze.outputs.html_path || steps.analyze.outputs.xml_path }}
          labels: |
            security
            zap
            automated-scan
          assignees: |
            # optional: add username(s) here, e.g. octocat
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify (no-op if no high found)
        if: steps.analyze.outputs.high_found == 'false'
        run: echo "No high/critical alerts detected — no issue created."

      - name: Finish
        run: echo "analyze-and-issue job completed."
