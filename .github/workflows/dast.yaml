name: DAST - ZAP Authenticated Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: show zap folder
        run: |
          echo ".zap files:"
          ls -la .zap || true
          echo "Show users section (no secrets):"
          sed -n '1,200p' .zap/login-flask2.context | sed -n '/<users>/,/<\/users>/p' || true

      - name: Context Setup - replace user/pass placeholders with secrets
        env:
          B64USER: ${{ secrets.B64USER }}
          B64PASS: ${{ secrets.B64PASS }}
        run: |
          if [ ! -f .zap/login-flask2.context ]; then
            echo "Context file .zap/login-flask2.context not found!"
            exit 1
          fi
          echo "Replacing PLACEHOLDERUSER..."
          sed -i "s|PLACEHOLDERUSER|${B64USER}|g" .zap/login-flask2.context
          echo "Replacing PASS_PLACEHOLDER..."
          sed -i "s|PLACEHOLDERPASSWORD|${B64PASS}|g" .zap/login-flask2.context
          echo "Placeholders replaced (content not printed for security)."

      - name: Show resulting users line (sanity, no secrets)
        run: sed -n '/<users>/,/<\/users>/p' .zap/login-flask2.context | sed 's/^[^>]*>/>/;s/<\\/user.*$//' || true

      - name: Authenticated ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://flaskshop.online'
          cmd_options: > 
            -n .zap/login-flask2.context
            -r zap-auth-report.html
            -J zap-auth-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-auth-reports
          path: zap-auth-report.*

