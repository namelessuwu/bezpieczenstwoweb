name: ZAP Automation Framework scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        with:
          plan: '.zap/plan.yml'
          # pass env var names that the container will pick up for use inside the plan
          docker_env_vars: |
            FLASKSHOP_URL
            ZAP_USER
            ZAP_PASS
        env:
          FLASKSHOP_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}
