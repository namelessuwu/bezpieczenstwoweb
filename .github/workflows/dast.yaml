name: DAST - ZAP Authenticated Full Scan (docker-run debug, fixed)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show .zap folder (no secrets)
        run: |
          echo "Files in .zap:"
          ls -la .zap || true
          echo "Preview plan header (no secrets):"
          sed -n '1,200p' .zap/plan.yml || true

      - name: Run ZAP docker with explicit envs and debug inside container
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          ZAP_USER:    ${{ secrets.ZAP_USER }}
          ZAP_PASS:    ${{ secrets.ZAP_PASS }}
        run: |
          docker run --rm -v "$PWD":/zap/wrk:rw --network=host \
            -e TARGET_URL="${TARGET_URL}" \
            -e ZAP_USER="${ZAP_USER}" \
            -e ZAP_PASS="${ZAP_PASS}" \
            -e REPORT_NAME="zap-auth-report.html" \
            ghcr.io/zaproxy/zaproxy:stable \
            sh -c '\
              echo "=== inside-container env presence check ==="; \
              if [ -z "$TARGET_URL" ]; then echo "TARGET_URL is EMPTY"; else echo "TARGET_URL is SET"; fi; \
              if [ -z "$ZAP_USER" ]; then echo "ZAP_USER is EMPTY"; else echo "ZAP_USER is SET"; fi; \
              if [ -z "$ZAP_PASS" ]; then echo "ZAP_PASS is EMPTY"; else echo "ZAP_PASS is SET"; fi; \
              echo "=== running ZAP autorun ==="; \
              zap.sh -cmd -autorun /zap/wrk/.zap/plan.yml \
            '

      - name: Upload ZAP reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-auth-reports
          path: |
            .zap/output/**
            zap-auth-report.*
            zap-auth-report.json
