name: ZAP Automation Framework scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Automation Framework
        uses: zaproxy/action-af@v0.2.0
        
        env:
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}
        with:
          plan: '.zap/plan.yml'
          docker_env_vars: |
            ZAP_USER
            ZAP_PASS

            
      - name: Generate ZAP HTML Report
        run: |
          docker run -v $PWD:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -session /zap/wrk/untitled_session.session \
            -last_scan_report /zap/wrk/zap_report.html -reportformat html

      - name: Generate ZAP JSON Report
        run: |
          docker run -v $PWD:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -session /zap/wrk/untitled_session.session \
            -last_scan_report /zap/wrk/zap_report.json -reportformat json

      - name: Upload ZAP Reports as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-reports
          path: |
            zap_report.html
            zap_report.json

