name: ZAP Authenticated DAST

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ZAP_PORT: 8080
  ZAP_HOST: 127.0.0.1

jobs:
  zap-auth-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scan script executable
        run: chmod +x .zap/zap-config-and-scan.sh

      - name: Validate required secrets
        run: |
          missing=""
          for v in ZAP_API_KEY TARGET_URL LOGIN_URL LOGIN_POST_DATA ZAP_USER ZAP_PASS; do
            if [ -z "${{ secrets[$v] }}" ]; then
              missing="${missing} $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: Missing repository secrets:$missing"
            echo "Please create them in Settings → Secrets and variables → Actions"
            exit 1
          fi
        shell: bash

      - name: Remove old zap container (best-effort)
        run: docker rm -f zap-dast >/dev/null 2>&1 || true

      - name: Start ZAP Docker (daemon) (force amd64)
        run: |
          docker run --name zap-dast -u zap -d \
            --platform linux/amd64 \
            -p ${ZAP_PORT}:${ZAP_PORT} \
            zaproxy/zap-stable:latest \
            zap.sh -daemon -host 0.0.0.0 -port ${ZAP_PORT} \
            -config api.disablekey=false -config api.key=${{ secrets.ZAP_API_KEY }}

      - name: Wait for ZAP to be ready (robust, 300s)
        env:
          APIKEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          set -euo pipefail
          ZAP_HOST=127.0.0.1
          ZAP_PORT=${{ env.ZAP_PORT }}
          APIKEY=${APIKEY:-}
          for i in $(seq 1 60); do   # 60 * 5s = 300s max
            echo "Checking ZAP ($i)..."
            if curl -s "http://${ZAP_HOST}:${ZAP_PORT}/JSON/core/view/version/?apikey=${APIKEY}" | grep -q '"version"'; then
              echo "ZAP ready (runner -> container)"
              exit 0
            fi
            if docker ps --filter "name=zap-dast" --format '{{.Names}}' | grep -q zap-dast; then
              echo "Trying curl inside container..."
              docker exec zap-dast sh -c "curl -s http://127.0.0.1:${ZAP_PORT}/JSON/core/view/version/?apikey=${APIKEY}" | grep -q '"version"' && { echo "ZAP ready (inside container)"; exit 0; } || true
            fi
            if [ $(( i % 6 )) -eq 0 ]; then
              echo "---- last container logs (tail 80) ----"
              docker logs zap-dast --tail 80 || true
              echo "--------------------------------------"
            fi
            sleep 5
          done
          echo "ZAP did not become ready after 300s — container logs (tail 200):"
          docker logs zap-dast --tail 200 || true
          exit 1

      - name: Show container status & logs on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a --filter "name=zap-dast"
          echo "=== last 200 lines of logs ==="
          docker logs zap-dast --tail 200 || true

      - name: Print env info (for debug)
        run: |
          echo "TARGET_URL set? ${TARGET_URL:-<not-set>}"
          echo "LOGIN_URL set? ${LOGIN_URL:-<not-set>}"
          echo "ZAP_HOST: ${ZAP_HOST}"
          echo "ZAP_PORT: ${ZAP_PORT}"

      - name: Run ZAP configuration & authenticated scan
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}       # e.g. https://staging.example.com
          LOGIN_URL: ${{ secrets.LOGIN_URL }}         # e.g. https://staging.example.com/login
          LOGIN_POST_DATA: ${{ secrets.LOGIN_POST_DATA }} # e.g. username={%username%}&password={%password%}
          ZAP_USER: ${{ secrets.ZAP_USER }}
          ZAP_PASS: ${{ secrets.ZAP_PASS }}
          ZAP_HOST: 127.0.0.1
          ZAP_PORT: 8080
        run: |
          set -euo pipefail
          echo "[*] Running scan script: .zap/zap-config-and-scan.sh"
          ./.zap/zap-config-and-scan.sh

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Upload ZAP alerts JSON (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-alerts
          path: zap-alerts.json

      - name: Dump zap container logs (always)
        if: always()
        run: docker logs zap-dast --tail 200 || true

      - name: Cleanup ZAP container
        if: always()
        run: docker rm -f zap-dast >/dev/null 2>&1 || true
