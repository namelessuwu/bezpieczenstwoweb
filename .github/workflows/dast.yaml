name: ZAP Authenticated DAST

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap-auth-scan:
    runs-on: ubuntu-latest
    env:
      ZAP_PORT: 8080
      ZAP_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ZAP Docker (daemon)
        run: |
          docker pull zaproxy/zap-stable:latest
          docker run --name zap-dast -u zap -d \
            -p 8080:8080 \
            zaproxy/zap-stable:latest \
            zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=false -config api.key=${ZAP_API_KEY}

      - name: Wait for ZAP to be ready
        # simple readiness loop
        run: |
          for i in $(seq 1 30); do
            echo "Checking ZAP ($i)..."
            if curl -s "http://${ZAP_HOST}:${ZAP_PORT}/JSON/core/view/version/?apikey=${{ secrets.ZAP_API_KEY }}" | grep -q "version"; then
              echo "ZAP is ready"
              exit 0
            fi
            sleep 2
          done
          echo "ZAP did not become ready"
          docker logs zap-dast || true
          exit 1

      - name: Make scan script executable
        run: chmod +x ci/zap-config-and-scan.sh

      - name: Run ZAP configuration & authenticated scan
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}       
          LOGIN_URL: ${{ secrets.LOGIN_URL }}         
          LOGIN_POST_DATA: ${{ secrets.LOGIN_POST_DATA }}
          AUTH_USERNAME: ${{ secrets.ZAP_USER }}
          AUTH_PASSWORD: ${{ secrets.ZAP_PASS }}
          ZAP_HOST: 127.0.0.1
          ZAP_PORT: 8080
        run: |
          .zap/zap-config-and-scan.sh

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
