name: SAST - CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  triage:
    name: Create security issue if CodeQL finds critical alerts
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Triage Script
        run: |
          pip install requests
          python - << 'EOF'
          import os
          import requests

          token = os.environ['GITHUB_TOKEN']
          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')

          url = f"https://api.github.com/repos/{owner}/{repo}/code-scanning/alerts"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          resp = requests.get(url, headers=headers)
          alerts = resp.json()

          critical_or_high = [a for a in alerts if a.get('rule', {}).get('security_severity', '').lower() in ['critical', 'high']]

          if critical_or_high:
              print(f"Found {len(critical_or_high)} HIGH/CRITICAL CodeQL alerts")
              # Create issue
              issue_url = f"https://api.github.com/repos/{owner}/{repo}/issues"
              issue_data = {
                  "title": f"CodeQL: {len(critical_or_high)} HIGH/CRITICAL findings",
                  "body": "Automatic CodeQL findings check",
                  "labels": ["security","codeql","urgent"]
              }
              r = requests.post(issue_url, json=issue_data, headers=headers)
              print(f"Issue created: {r.json().get('html_url')}")
          else:
              print("No high/critical alerts found")
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
