name: SAST - CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: SAST_raport
          path: .

  triage:
    name: Create security issue if CodeQL finds high/critical alerts
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      issues: write
      security-events: read
    steps:
      - name: Check out repository (needed for context)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install github-script dependencies
        run: npm install @actions/core
        
      - name: Query Code Scanning alerts and create issue on HIGH/CRITICAL
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
           
            const resp = await github.rest.codeScanning.listAlertsForRepo({
              owner,
              repo,
              state: 'open'
            });

            const alerts = resp.data || [];
            const criticalOrHigh = alerts.filter(a => {
              const sev = a.rule && (a.rule.security_severity || a.rule.severity || a.rule.level);
              if (!sev) return false;
              const s = String(sev).toLowerCase();
              return s === 'critical' || s === 'high' || s === 'error';
            });

            if (criticalOrHigh.length > 0) {
              const sample = criticalOrHigh.slice(0, 10).map(x => {
                const title = x.rule && (x.rule.id || x.rule.description || x.rule.name) || 'CodeQL finding';
                const url = x.html_url || `https://github.com/${owner}/${repo}/security/code-scanning`;
                return `- ${title} (severity: ${x.rule && (x.rule.security_severity || x.rule.severity)})\n  ${url}`;
              }).join('\n');

              const body = `Automatyczny alert: znaleziono **${criticalOrHigh.length}** wysokiego/critical poziomu CodeQL findings.\n\nPrzykłady:\n\n${sample}\n`;

              await github.rest.issues.create({
                owner,
                repo,
                title: `CodeQL: ${criticalOrHigh.length} HIGH/CRITICAL findings`,
                body,
                labels: ['security','codeql','urgent']
              });

              core = require('@actions/core');
              core.setFailed(`${criticalOrHigh.length} high/critical CodeQL alerts found`);
            } else {
              console.log("No high/critical CodeQL alerts found.");
            }

